name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    # 18:45 UTC = 14:45 New York in summer (EDT), 13:45 in winter (EST): inside the US session, so option
    # quotes are live. GitHub may start scheduled runs late; there is still >1h before the 16:00 close.
    - cron: "45 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  plan:
    # Refresh on the schedule, on a manual run, or when a push changes tickers.txt (new tickers need data now).
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.p.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: p
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "refresh=true" >> "$GITHUB_OUTPUT";
          elif git diff --name-only HEAD~1 HEAD | grep -qx tickers.txt; then echo "refresh=true" >> "$GITHUB_OUTPUT";
          else echo "refresh=false" >> "$GITHUB_OUTPUT"; fi

  refresh:
    # tickers.txt split 8 ways: parallel runners keep each one's Yahoo traffic modest and the run short.
    needs: [test, plan]
    if: needs.plan.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python -m tools.build_site refresh --db shard.sqlite --shard ${{ matrix.shard }}/8
      - name: Screener for this shard's tickers (parallel across shards instead of one long build step)
        run: python -m tools.build_site screen --db shard.sqlite --out screen.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            shard.sqlite
            screen.json
          retention-days: 2

  build:
    needs: [test, plan, refresh]
    # runs even if refresh was skipped (plain push) or some shards failed: their tickers keep the previous data
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start from the deployed snapshot (data survives even if Yahoo refuses the runners)
        run: |
          mkdir -p data
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data"
          if curl -fsSL "$base/full.sqlite.gz" -o prev.sqlite.gz; then gunzip -f prev.sqlite.gz; echo "restored full.sqlite.gz";
          elif curl -fsSL "$base/market.sqlite" -o prev.sqlite; then echo "restored legacy market.sqlite";
          else cp seed/market.sqlite prev.sqlite; echo "first deploy: using seed/market.sqlite"; fi
          curl -fsSL "$base/index.json" -o prev_index.json || echo "no previous index.json"
      - uses: actions/download-artifact@v4
        if: needs.refresh.result != 'skipped'
        continue-on-error: true
        with:
          pattern: shard-*
          path: shards
      - name: Merge new data over the previous snapshot and build site/
        run: |
          python -m tools.build_site merge --base prev.sqlite --shards $(ls shards/shard-*/shard.sqlite 2>/dev/null) --out full.sqlite
          python -m tools.build_site site --db full.sqlite --out site --prev-index prev_index.json \
            --screens $(ls shards/shard-*/screen.json 2>/dev/null)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
